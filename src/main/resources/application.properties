
spring.application.name=gateway
server.port=${SERVER_PORT:8080}

# Eureka Discovery
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

# Descubrimiento de servicios
spring.cloud.gateway.discovery.locator.lower-case-service-id=true
spring.cloud.gateway.discovery.locator.enabled=false

# Ruta para cuentas
spring.cloud.gateway.server.webflux.routes[0].id=cuentas
spring.cloud.gateway.server.webflux.routes[0].uri=lb://cuentas
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/cuentas/**

# Ruta para movimientos
spring.cloud.gateway.server.webflux.routes[1].id=movimientos
spring.cloud.gateway.server.webflux.routes[1].uri=lb://cuentas
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/movimientos/**

# Ruta para clientes
spring.cloud.gateway.server.webflux.routes[2].id=clientes
spring.cloud.gateway.server.webflux.routes[2].uri=lb://clientes
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/clientes/**
